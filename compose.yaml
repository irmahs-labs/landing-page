# Caddy lives in irmahs-labs/proxy and reaches this app over the shared
# `proxy` network as `landing-page:3000`. No ports are published here.
services:
  web:
    build: .
    image: landing-page-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Asks who's an admin of the account service directly, not through
      # Cloudflare (irmahs-labs/auth, also on the proxy network)
      AUTH_INTERNAL_URL: http://auth:3001
    # The CV uploaded from the page, kept across deploys
    volumes:
      - cv:/app/data
    networks:
      proxy:
        aliases: [landing-page]

volumes:
  cv:

networks:
  proxy:
    external: true
