services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    working_dir: /app
    user: node
    env_file: .env
    volumes:
      - ./api:/app:ro

volumes:
  caddy_data:
  caddy_config:
