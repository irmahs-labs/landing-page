# Caddy lives in irmahs-labs/proxy and reaches this app over the shared
# `proxy` network as `landing-page:3000`. No ports are published here.
services:
  web:
    build: .
    image: landing-page-web
    restart: unless-stopped
    env_file: .env
    # The CV uploaded from the page, kept across deploys
    volumes:
      - cv:/app/data
    networks:
      proxy:
        aliases: [landing-page]

volumes:
  cv:

networks:
  proxy:
    external: true
