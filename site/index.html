<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Irma Houver Sing</title>
  <meta name="description" content="Irma Houver Sing, fullstack developer based in Paris.">
  <style>
    :root { --bg:#faf8f5; --fg:#1d1b19; --muted:#6b655e; --accent:#c2410c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151413; --fg:#f2efea; --muted:#a39d95; --accent:#fb923c; } }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--bg); color:var(--fg);
           font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:560px; }
    .tag { color:var(--accent); font-weight:600; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; }
    h1 { font-size:clamp(2rem,6vw,3.2rem); line-height:1.1; margin:.4em 0 .3em; }
    p { color:var(--muted); }
    nav { margin-top:1.6em; display:flex; gap:1.2em; flex-wrap:wrap; }
    a { color:var(--fg); text-decoration-color:var(--accent); text-underline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Coming soon · Bientôt</div>
    <h1>Irma Houver Sing</h1>
    <p>Fullstack developer based in Paris. The new site is on its way.</p>
    <nav>
      <a href="https://github.com/irmahs">GitHub</a>
      <a href="https://www.linkedin.com/in/irmahs">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
